services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: pulsechat
      POSTGRES_PASSWORD: pulsechat
      POSTGRES_DB: pulsechat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
